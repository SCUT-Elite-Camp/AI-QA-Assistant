name: Personal Library P0

on:
  pull_request:
    paths:
      - "agent/**"
      - "attachment-service/**"
      - "data-pipeline/**"
      - "data-persistence/**"
      - "shared_runtime/**"
      - "toolset/**"
      - "frontend/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/personal-library-ci.yml"
  push:
    branches: [toolset]

concurrency:
  group: personal-library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  personal-library:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGENT_BASE_URL: "http://127.0.0.1:8000"
      ATTACHMENTS_ENABLED: "false"
      PERSONAL_LIBRARY_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\attachment-service;${{ github.workspace }}\data-pipeline;${{ github.workspace }}\data-persistence;${{ github.workspace }}\toolset;${{ github.workspace }}\agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Personal Library Python P0 suite
        run: >-
          python -m pytest
          attachment-service/tests
          toolset/tests
          agent/tests/unit/test_personal_library_evidence.py
          agent/tests/unit/test_personal_library_routing.py
          agent/tests/unit/test_personal_library_tool.py
          -q

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend integration tests
        working-directory: frontend
        run: pnpm exec vitest run --config vitest.config.ts

      # The repository-wide frontend lint/typecheck currently report legacy
      # issues outside the Personal Library paths. Keep those reports visible
      # without allowing unrelated debt to mask this scoped P0 regression gate.
      - name: Report frontend lint baseline
        continue-on-error: true
        working-directory: frontend
        run: pnpm run lint

      - name: Lint Personal Library frontend paths
        working-directory: frontend
        run: pnpm exec eslint server/database/schema.ts server/routes/api/library/files server/utils/drizzle.ts server/utils/library.ts server/utils/libraryVersionService.ts tests vitest.config.ts

      - name: Report frontend typecheck baseline
        continue-on-error: true
        working-directory: frontend
        run: pnpm run typecheck

      - name: Build frontend application
        working-directory: frontend
        run: |
          New-Item -ItemType Directory -Force .data | Out-Null
          pnpm run build
