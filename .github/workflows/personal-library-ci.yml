name: Personal Library P0

on:
  pull_request:
    paths:
      - "agent/**"
      - "attachment-service/**"
      - "data-pipeline/**"
      - "toolset/**"
      - "web/**"
      - ".github/workflows/personal-library-ci.yml"
  push:
    branches: [toolset]

concurrency:
  group: personal-library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  personal-library:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ATTACHMENTS_ENABLED: "false"
      PERSONAL_LIBRARY_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\attachment-service;${{ github.workspace }}\data-pipeline;${{ github.workspace }}\data-persistence;${{ github.workspace }}\toolset;${{ github.workspace }}\agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Personal Library Python P0 suite
        run: >-
          python -m pytest
          attachment-service/tests
          toolset/tests
          agent/tests/unit/test_personal_library_evidence.py
          agent/tests/unit/test_personal_library_routing.py
          agent/tests/unit/test_personal_library_source_intent.py
          agent/tests/unit/test_personal_library_tool.py
          -q

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Web integration tests
        working-directory: web
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Lint Personal Library Web paths
        working-directory: web
        run: |
          pnpm run lint
          pnpm exec eslint server/database/schema.ts server/routes/api/library/files server/utils/drizzle.ts server/utils/library.ts server/utils/libraryVersionService.ts tests vitest.config.ts

      - name: Typecheck Web application
        working-directory: web
        run: pnpm run typecheck

      - name: Build Web application
        working-directory: web
        run: pnpm run build
